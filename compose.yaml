name: nipaplay-fnos
services:
  app:
    image: nipaplay-fnos:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
      additional_contexts:
        flutter_source: ./.porting/docker-sdk
        pub_dependencies: ./.porting/docker-pub
      args:
        SOURCE_REVISION: ${NIPAPLAY_SOURCE_REVISION:-uncommitted}
        SOURCE_DIGEST: ${NIPAPLAY_SOURCE_DIGEST:-unknown}
    ports:
      - "127.0.0.1:${NIPAPLAY_HTTP_PORT:-1182}:1180"
    environment:
      NIPAPLAY_DEV_ORIGINS: "http://127.0.0.1:1183,http://localhost:1183"
    volumes:
      - data:/data
      - type: bind
        source: ${NIPAPLAY_MEDIA_DIR:?Set NIPAPLAY_MEDIA_DIR to an absolute host media folder}
        target: /media/anime
        read_only: true
        bind:
          create_host_path: false
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  data:
    external: true
    name: nipaplay-fnos-data
