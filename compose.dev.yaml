services:
  app:
    image: nipaplay-fnos:development
    build:
      target: development
    user: "10001:10001"
    environment:
      NIPAPLAY_WEB_ROOT: ""
      NIPAPLAY_SERVER_KERNEL: /tmp/nipaplay-server.dill
    volumes:
      - ./lib:/app/lib:ro
      - ./server:/app/server:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1180/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
